name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ── Build native installer per OS ────────────────────────────────────────
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb
            path: app/build/compose/binaries/main/deb
            ext: deb

          - os: windows-latest
            task: packageMsi
            path: app/build/compose/binaries/main/msi
            ext: msi

          - os: macos-latest
            task: packageDmg
            path: app/build/compose/binaries/main/dmg
            ext: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build installer
        run: ./gradlew :app:${{ matrix.task }} --no-daemon
        shell: bash

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.path }}/*.${{ matrix.ext }}
          retention-days: 30

  # ── Create GitHub Release and attach installers ──────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**
          generate_release_notes: true
